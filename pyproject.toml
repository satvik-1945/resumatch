[project]
name = "resumatch"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "jsonata-python>=0.6,<1",
  "pypdf>=5.4,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/resumatch"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["resumatch"]

[tool.ruff.lint.per-file-ignores]
"services/api/resumatch/routes.py" = ["B008"]
"services/api/resumatch/auth.py" = ["B008"]
