name: resumatch
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumatch_local_only}
      POSTGRES_DB: resumatch
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumatch -d resumatch"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
